<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌱 AI Plant Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.5s ease-out;
      }
      .moisture-bar {
        transition: width 0.5s ease-out;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <!-- Header -->
      <header class="text-center mb-12">
        <h1 class="text-5xl font-bold text-green-800 mb-2">
          🌱 AI Plant Monitor
        </h1>
        <p class="text-gray-600 text-lg">
          Real-time plant health tracking powered by Claude AI
        </p>
        <div
          class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-green-100 rounded-full"
        >
          <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
          <span class="text-sm font-medium text-green-800"
            >Live Updates Active</span
          >
        </div>
      </header>

      <!-- Main Content -->
      <div id="logs-container" class="space-y-6">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
          <div
            class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-green-500 border-t-transparent"
          ></div>
          <p class="mt-4 text-gray-600">Loading plant data...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
          <div class="text-6xl mb-4">🌿</div>
          <h3 class="text-2xl font-semibold text-gray-700 mb-2">
            No Plant Logs Yet
          </h3>
          <p class="text-gray-500">
            Upload your first plant photo from your IoT device!
          </p>
        </div>

        <!-- Plant logs will be inserted here -->
      </div>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
